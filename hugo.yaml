baseURL: "https://taciturn.uk/"
languageCode: "en-gb"
title: "Orlando Valdes-Scott"
theme: "PaperMod"
paginate: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Orlando Valdes-Scott
  description: "Research, projects, and systems — algorithmic trading, materials science, and everything in between."
  author: Orlando Valdes-Scott
  DateFormat: "2 January 2006"
  defaultTheme: dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: false

  homeInfoParams:
    Title: "Orlando Valdes-Scott"
    Content: >
      Building systems at the intersection of code, markets, and science.
      Currently developing Taciturn — an autonomous algorithmic trading engine —
      and researching carbon nanotube applications. Based in Coventry, UK.

  socialIcons:
    - name: github
      url: "https://github.com/orlandovaldezscott"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 10
    - identifier: posts
      name: Writing
      url: /posts/
      weight: 20
    - identifier: about
      name: About
      url: /about/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON
